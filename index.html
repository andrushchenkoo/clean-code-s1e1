<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body class="page">
    <header class="hero">
      <img class="hero__img" src="./eisenhower-matrix.jpg"alt="Eisenhower Matrix"/>
      <a class="hero__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="section" id="topSectionForAddingElementToList">
          <label class="section__label" for="new-task">Add Item</label>
        <div class="flex-wrapper">
          <input class="section__input task" id="new-task" type="text" />
          <button class="section__btn">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="section__title">Todo</h2>
        <ul class="section__list" id="incompleteTasks">
          <li class="section__list-item">
            <input class="section__input" type="checkbox" />
            <label class="sectopm__label task">Pay Bills</label>
            <input class="section__input task" type="text"/>
            <button class="section__btn edit">Edit</button>
            <button class="section__btn delete">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>
          <li class="section__list-item editMode">
            <input class="section__input" type="checkbox" />
            <label class="section__label task">Go Shopping</label>
            <input class="section__input task" type="text" value="Go Shopping"/>
            <button class="section__btn edit">Save</button>
            <button class="section__btn delete">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__title">Completed</h2>
        <ul class="section__list" id="completed-tasks">
          <li class="section__list-item">
            <input class="section__input" type="checkbox" checked />
            <label class="section__label task">See the Doctor</label>
            <input class="section__input task" type="text"  />
            <button class="section__btn edit">Edit</button>
            <button class="section__btn delete">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
